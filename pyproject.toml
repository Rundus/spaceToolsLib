[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spaceToolsLib"
version = "0.0.70"
authors = [
  {name="Connor Feltman", email="cfeltman@uiowa.edu"},
]
description = "A small package containing useful variables, functions and methods to interface with CDF files in the field of Space Plasma Physics."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]


dependencies = [
    "numpy",
    "spacepy",
    "cdflib",
    "scipy",
    "matplotlib",
    "chaosmagpy",   # used by tools/models.py (CHAOS geomagnetic field model)
    "numba",        # used by supportPackages/pymssa (MSSA optimized ops)
    "tqdm",         # used by supportPackages/pymssa
    "scikit-learn", # used by supportPackages/pymssa
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/Rundus/spaceToolsLib"
Issues = "https://github.com/Rundus/spaceToolsLib/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/spaceToolsLib"]